<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Gate Times</title>
<style>
  :root {
    --black: #000000;
    --white: #ffffff;
    --gray: #999999;
    --line: #000000;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--white);
    color: var(--black);
    font-family: Verdana, Geneva, sans-serif;
    margin: 0;
    padding: 48px 24px;
    display: flex;
    justify-content: center;
  }

  main {
    width: 100%;
    max-width: 480px;
  }

  h1 {
    font-size: 15px;
    font-weight: normal;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 0 0 32px 0;
    text-align: center;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    font-size: 10px;
    font-weight: normal;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gray);
    text-align: left;
    padding: 0 8px 8px 8px;
    border-bottom: 1px solid var(--black);
  }

  thead th.num-col { text-align: center; width: 34px; }
  thead th.calc-col { text-align: right; }

  tbody td {
    padding: 6px 8px;
    border-bottom: 1px solid #e0e0e0;
    vertical-align: middle;
  }

  tbody tr:last-child td {
    border-bottom: 1px solid var(--black);
  }

  td.num {
    text-align: center;
    font-size: 12px;
    color: var(--gray);
    width: 34px;
  }

  td.input-cell input {
    width: 100%;
    border: none;
    border-bottom: 1px solid #cccccc;
    background: transparent;
    font-family: Verdana, Geneva, sans-serif;
    font-size: 14px;
    color: var(--black);
    padding: 4px 2px;
    outline: none;
    text-align: left;
  }

  td.input-cell input:focus {
    border-bottom: 1px solid var(--black);
  }

  td.input-cell input.invalid {
    color: #cc0000;
    border-bottom: 1px solid #cc0000;
  }

  td.input-cell input::placeholder {
    color: #cccccc;
  }

  td.calc {
    text-align: right;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  td.calc.empty {
    color: #cccccc;
  }

  .footnote {
    margin-top: 20px;
    font-size: 10px;
    color: var(--gray);
    letter-spacing: 0.02em;
    text-align: center;
  }
</style>
</head>
<body>
<main>
  <h1>Gate Times</h1>
  <table>
    <thead>
      <tr>
        <th class="num-col">Gate</th>
        <th>Time</th>
        <th class="calc-col">Elapsed</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="footnote">m:ss.ms &mdash; e.g. 1:23.45</div>
</main>

<script>
  const GATE_COUNT = 10;
  const rowsEl = document.getElementById('rows');
  const PATTERN = /^(\d):([0-5]\d)\.(\d{2})$/;

  function buildRows() {
    for (let i = 1; i <= GATE_COUNT; i++) {
      const tr = document.createElement('tr');

      const numTd = document.createElement('td');
      numTd.className = 'num';
      numTd.textContent = i;

      const inputTd = document.createElement('td');
      inputTd.className = 'input-cell';
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = '0:00.00';
      input.dataset.index = i;
      input.autocomplete = 'off';
      input.spellcheck = false;
      input.addEventListener('input', onInput);
      inputTd.appendChild(input);

      const calcTd = document.createElement('td');
      calcTd.className = 'calc empty';
      calcTd.id = 'calc-' + i;
      calcTd.textContent = '—';

      tr.appendChild(numTd);
      tr.appendChild(inputTd);
      tr.appendChild(calcTd);
      rowsEl.appendChild(tr);
    }
  }

  function parseTime(str) {
    const m = str.trim().match(PATTERN);
    if (!m) return null;
    const minutes = parseInt(m[1], 10);
    const seconds = parseInt(m[2], 10);
    const centis = parseInt(m[3], 10);
    return minutes * 6000 + seconds * 100 + centis;
  }

  function formatCentis(totalCentis) {
    if (totalCentis < 0) totalCentis = 0;
    const minutes = Math.floor(totalCentis / 6000);
    const seconds = Math.floor((totalCentis % 6000) / 100);
    const centis = totalCentis % 100;
    return minutes + ':' + String(seconds).padStart(2, '0') + '.' + String(centis).padStart(2, '0');
  }

  function onInput(e) {
    const input = e.target;
    const raw = input.value.trim();

    if (raw === '') {
      input.classList.remove('invalid');
    } else {
      const valid = PATTERN.test(raw);
      input.classList.toggle('invalid', !valid);
    }

    recalculate();
  }

  function recalculate() {
    const inputs = Array.from(document.querySelectorAll('input[data-index]'));
    const values = inputs.map(inp => {
      const raw = inp.value.trim();
      if (raw === '') return null;
      return parseTime(raw);
    });

    let prev = 0;
    for (let i = 0; i < values.length; i++) {
      const gateNum = i + 1;
      const calcTd = document.getElementById('calc-' + gateNum);
      const current = values[i];

      if (current === null) {
        calcTd.textContent = '—';
        calcTd.classList.add('empty');
        continue;
      }

      const elapsed = current - prev;
      calcTd.textContent = formatCentis(elapsed);
      calcTd.classList.remove('empty');
      prev = current;
    }
  }

  buildRows();
</script>
</body>
</html>
